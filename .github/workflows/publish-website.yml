name: Publish VoiceFlow website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/publish-website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-voiceflow-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Build production site
        working-directory: website
        run: npm run build

      - name: Add deployment metadata
        run: |
          printf '%s\n' "$GITHUB_SHA" > website/dist/deployment-version.txt
          touch website/dist/.nojekyll

      - name: Publish compiled site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd website/dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish VoiceFlow website from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
