name: VoiceFlow macOS build

on:
  push:
    branches: [main, fix-crash-and-permissions]
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "scripts/build-whisper-libs.sh"
      - "scripts/whisper-smoke-test.c"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "scripts/build-whisper-libs.sh"
      - "scripts/whisper-smoke-test.c"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceflow-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project VoiceFlow.xcodeproj -list

      - name: Build matching whisper.cpp headers and libraries
        run: bash scripts/build-whisper-libs.sh

      - name: Run Whisper ABI and inference smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

          clang -std=c11 -O2 \
            -I VoiceFlow/Transcription \
            -I VoiceFlow/Headers \
            VoiceFlow/Transcription/WhisperC.c \
            scripts/whisper-smoke-test.c \
            -L VoiceFlow/Libs \
            -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas \
            -lc++ \
            -framework Accelerate \
            -framework Metal \
            -framework MetalKit \
            -framework Foundation \
            -o "$RUNNER_TEMP/whisper-smoke-test"

          "$RUNNER_TEMP/whisper-smoke-test" "$RUNNER_TEMP/ggml-tiny.bin"

      - name: Build Debug and Release without signing
        shell: bash
        run: |
          set -o pipefail
          : > build.log

          for configuration in Debug Release; do
            echo "===== ${configuration} =====" | tee -a build.log
            xcodebuild \
              -project VoiceFlow.xcodeproj \
              -scheme VoiceFlow \
              -configuration "${configuration}" \
              -destination "platform=macOS" \
              -derivedDataPath "DerivedData-${configuration}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build 2>&1 | tee -a build.log | xcpretty
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voiceflow-xcode-build-log
          path: build.log
