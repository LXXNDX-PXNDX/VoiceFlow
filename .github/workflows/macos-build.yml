name: VoiceFlow macOS build

on:
  push:
    branches: [performance-ui-overhaul]
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceflow-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project VoiceFlow.xcodeproj -list

      - name: Build pinned whisper.cpp libraries
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.8.6 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_METAL=ON \
            -DGGML_ACCELERATE=ON
          cmake --build /tmp/whisper-build --config Release --parallel 6

          mkdir -p VoiceFlow/Libs
          for library in libwhisper.a libggml.a libggml-base.a libggml-cpu.a libggml-metal.a libggml-blas.a; do
            source_path="$(find /tmp/whisper-build -name "$library" -type f -print -quit)"
            if [[ -z "$source_path" ]]; then
              echo "Missing required library: $library"
              find /tmp/whisper-build -name '*.a' -print
              exit 1
            fi
            cp "$source_path" "VoiceFlow/Libs/$library"
          done

          echo "Prepared static libraries:"
          ls -lh VoiceFlow/Libs

      - name: Build VoiceFlow without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceFlow.xcodeproj \
            -scheme VoiceFlow \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | xcpretty

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voiceflow-xcode-build-log
          path: build.log
