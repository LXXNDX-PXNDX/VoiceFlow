name: VoiceFlow macOS build

on:
  push:
    branches: [performance-ui-overhaul]
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "scripts/build-whisper-libs.sh"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "scripts/build-whisper-libs.sh"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceflow-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project VoiceFlow.xcodeproj -list

      - name: Build pinned whisper.cpp libraries
        run: bash scripts/build-whisper-libs.sh

      - name: Build VoiceFlow without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceFlow.xcodeproj \
            -scheme VoiceFlow \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | xcpretty

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voiceflow-xcode-build-log
          path: build.log
