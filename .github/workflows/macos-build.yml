name: VoiceFlow macOS build

on:
  push:
    branches: [main, performance-ui-overhaul]
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "scripts/build-whisper-libs.sh"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "VoiceFlow/**"
      - "VoiceFlow.xcodeproj/**"
      - "scripts/build-whisper-libs.sh"
      - "project.yml"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceflow-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project VoiceFlow.xcodeproj -list

      - name: Build pinned whisper.cpp libraries
        run: bash scripts/build-whisper-libs.sh

      - name: Build Debug and Release without signing
        shell: bash
        run: |
          set -o pipefail
          : > build.log

          for configuration in Debug Release; do
            echo "===== ${configuration} =====" | tee -a build.log
            xcodebuild \
              -project VoiceFlow.xcodeproj \
              -scheme VoiceFlow \
              -configuration "${configuration}" \
              -destination "platform=macOS" \
              -derivedDataPath "DerivedData-${configuration}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build 2>&1 | tee -a build.log | xcpretty
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voiceflow-xcode-build-log
          path: build.log
