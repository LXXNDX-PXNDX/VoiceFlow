name: Publish VoiceFlow Landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled private landing page
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-06e0-81f4-b388-02ac874f86ca/raw?se=2026-07-28T13:16:17Z&sp=r&sv=2026-02-06&sr=b&scid=39b47e34-9f37-51f7-aa90-0cde7832957a&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-28T04:45:55Z&ske=2026-07-30T04:45:55Z&sks=b&skv=2026-02-06&sig=xH6fYj%2BHr%2BlUxOGXVv1oSPTDlgw4/Vuys5wOgA0fjiA%3D'
        run: |
          curl --fail --location "$ARTIFACT_URL" --output voiceflow-site.zip
          mkdir site
          unzip -q voiceflow-site.zip -d site
          touch site/.nojekyll

      - name: Publish compiled site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
