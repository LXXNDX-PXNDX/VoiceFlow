name: Deploy VoiceFlow landing page

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Build production site
        working-directory: website
        run: npm run build

      - name: Add deployment version
        run: printf '%s\n' "$GITHUB_SHA" > website/dist/deployment-version.txt

      - name: Disable Jekyll processing
        run: touch website/dist/.nojekyll

      - name: Publish compiled files to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd website/dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy VoiceFlow landing page from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages

      - name: Check out the compiled branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: compiled-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v4
        with:
          path: compiled-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/pages-last-success.txt';
            const content = Buffer.from(`${context.sha}\n`).toString('base64');
            let sha;

            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Record successful VoiceFlow Pages deployment',
              content,
              sha,
              branch: 'main'
            });
