name: VoiceFlow
options:
  bundleIdPrefix: com.voiceflow
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  VoiceFlow:
    type: application
    platform: macOS
    sources:
      - path: VoiceFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceflow.app
        PRODUCT_NAME: VoiceFlow
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: VoiceFlow/Info.plist
        # Signed with a real developer certificate, not ad-hoc: macOS ties the
        # Accessibility grant to the code signature, and an ad-hoc signature changes
        # with every build — which silently invalidated the permission each rebuild.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: U8ZG4H6LAP
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: VoiceFlow/VoiceFlow.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: VoiceFlow/VoiceFlow-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/VoiceFlow/Headers"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - "-lc++"
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-metal"
          - "-lggml-blas"
          - "-L$(SRCROOT)/VoiceFlow/Libs"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework Foundation"
          - "-framework Carbon"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_ENABLE_MODULES: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
